<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Siden findes ikke · Nyvangsskolen 1999</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23a8472a'/%3E%3Cpath d='M18 48V16h6l16 21V16h6v32h-6L24 27v21z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root { --flade: #f4f6f1; --tekst: #1b2420; --svag: #56645d; --tegl: #a8472a; --linje: rgba(27, 36, 32, 0.18); }
@media (prefers-color-scheme: dark) { :root { --flade: #1d2925; --tekst: #edf1ea; --svag: #a5b3ab; --tegl: #e0794f; --linje: rgba(237, 241, 234, 0.2); } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--flade); color: var(--tekst);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
main { width: min(100%, 460px); border: 1px solid var(--linje); padding: 22px 24px; }
h1 { margin: 0 0 10px; font: 600 22px/1.2 "Century Gothic", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; text-wrap: balance; }
p { margin: 0 0 12px; color: var(--svag); }
a { color: var(--tegl); font-weight: 600; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--tegl); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Nyvangsskolen</h1>
  <p>Den side findes ikke. Skolen står på forsiden.</p>
  <p><a href="/">Gå til skolen</a></p>
</main>
</body>
